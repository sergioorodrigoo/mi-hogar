<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Mi Hogar"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Mi Hogar</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px 26px;background:#e5ebee;color:#27343c;font-family:"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}.top{overflow:hidden}.brand{float:left;font-size:19px;font-weight:600}.date{float:right;color:#64737d;font-size:14px}.clock{font-size:68px;font-weight:200;letter-spacing:-3px;margin:18px 0 4px}.greeting{color:#657782;margin-bottom:18px}.heading{font-size:16px;font-weight:600;margin:18px 0 10px}.grid{overflow:hidden;margin:0 -6px}.tile{float:left;width:calc(25% - 12px);margin:6px;background:#fff;border:0;border-radius:19px;min-height:118px;padding:16px;text-align:left;color:#26323a;font-family:inherit;box-shadow:0 3px 12px rgba(50,70,90,.06)}.tile.on{background:#ffedb7}.tile .sym{display:block;font-size:25px;margin-bottom:13px}.tile strong{display:block;font-size:16px}.tile small{display:block;color:#6e7b84;margin-top:5px;font-size:12px}.climate .tile{min-height:105px}.player{background:#fff;border-radius:20px;padding:16px;overflow:hidden}.album{float:left;width:75px;height:75px;border-radius:12px;background:#dce4e8;text-align:center;line-height:75px;font-size:34px;margin-right:15px}.track{font-weight:600;font-size:16px;padding-top:6px}.artist{color:#74818a;font-size:13px;margin-top:5px}.controls{margin-top:14px;clear:both}.controls button,.scenes button{background:#e9eef1;border:0;border-radius:12px;padding:11px 18px;margin:3px 6px 3px 0;font-size:16px;color:#26323a}.device{display:block;margin-top:12px;font-size:13px;color:#62727c}.device select{font-size:14px;margin-left:8px;max-width:60%}.foot{font-size:12px;color:#6d7a84;margin-top:18px;line-height:1.5}@media(max-width:700px){.tile{width:calc(50% - 12px)}.clock{font-size:54px}body{padding:18px}}

body { max-width: 1152px; margin: 0 auto; padding: 22px 30px; background: #eff2ee; color: #21332f; }
h1.brand { margin: 0 12px 0 0; font-size: 21px; }
.top { padding-bottom: 16px; border-bottom: 1px solid #d5ddd6; }
.badge { display: inline-block; padding: 4px 9px; border-radius: 12px; background: #dce8df; font-size: 12px; color: #304c3c; }
.date { line-height: 25px; }
.overview, .columns, .climate { overflow: hidden; }
.welcome { float: left; width: 40%; }
.clock { margin: 6px 0 2px; font-size: 76px; }
.greeting { margin-bottom: 6px; }
.climate { float: right; width: 60%; padding: 12px 0 0; }
.climate .tile { width: 47%; margin: 4px 1.5%; min-height: 94px; }
.climate .sym { font-size: 18px; margin-bottom: 4px; }
.lighting { float: left; width: 55%; padding-right: 22px; }
.music { float: right; width: 45%; }
.heading { font-size: 19px; margin: 14px 0 9px; }
.heading small { font-size: 12px; font-weight: normal; color: #506660; margin-left: 6px; }
.grid { margin: 0 -4px; }
.grid .tile { width: 48%; margin: 4px 1%; min-height: 112px; position: relative; }
button, select, input { font-family: inherit; }
button { cursor: pointer; -webkit-appearance: none; }
button:focus, select:focus, input:focus { outline: 2px solid #205d4c; outline-offset: -2px; }
.grid .tile:after { content: ''; position: absolute; top: 17px; right: 15px; width: 27px; height: 15px; border-radius: 12px; background: #657770; }
.grid .tile:before { content: ''; position: absolute; z-index: 1; top: 19px; right: 29px; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
.grid .tile.on:after { background: #326351; }
.grid .tile.on:before { right: 17px; }
.tile.on { background: #fff0c5; }
.tile small, .artist, .device, .foot { color: #526660; }
.player { padding: 14px 16px; box-shadow: 0 3px 12px rgba(50,70,90,.07); }
.album { width: 57px; height: 57px; line-height: 57px; margin-bottom: 9px; }
.controls { margin-top: 0; text-align: center; }
.controls button, .scenes button, .refresh button, select { min-height: 44px; }
.controls button { min-width: 54px; }
#play, #allon { background: #315c4d; color: #fff; }
#echo { width: 100%; margin-top: 4px; border: 1px solid #cbd8cf; border-radius: 10px; color: #21332f; background: #f5f8f5; padding: 0 8px; }
.device { margin-top: 7px; }
#volume { width: 100%; margin: 0; height: 44px; }
#volumeValue { float: right; }
.refresh button { background: #e6eee9; border: 0; border-radius: 10px; padding: 0 12px; color: #284b3d; font-size: 14px; }
#demo { margin-top: 7px; font-size: 12px; color: #526660; }
.foot { margin-top: 12px; }
@media (max-width: 620px) {
  body { padding: 16px; }
  .lighting, .music { float: none; width: 100%; padding: 0; }
  .welcome, .climate { float: none; width: 100%; }
  .date { float: none; clear: both; padding-top: 5px; }
}

body.night { background:#151e27; color:#edf3f6; }
.night .top { border-color:#455467; }
.night .tile,.night .player { background:#273545; color:#edf3f6; box-shadow:none; }
.night .tile.on { background:#624c29; color:#fff2cd; }
.night .date,.night .greeting,.night .artist,.night .device,.night .foot,.night .tile small,.night .heading small,.night #demo { color:#c1cfdb; }
.night .controls button,.night .scenes button,.night .refresh button,.night #echo { background:#394c60; color:#f1f6fa; }
.night #play,.night #allon { background:#8cbca9; color:#172d26; }
.night .album { color:#293646; }
.night button:focus,.night select:focus,.night input:focus { outline-color:#d3e9dc; }
</style></head><body><div class="top"><h1 class="brand">⌂ Mi Hogar</h1><span class="badge">Modo demostración</span><div class="date" id="date"></div></div><main><div class="overview"><div class="welcome"><div class="clock" id="clock">--:--</div><div class="greeting" id="greeting">Tu hogar, de un vistazo</div></div><section class="climate" aria-label="Clima interior"><div class="tile"><span class="sym">◉</span><strong>-- °C</strong><small>Temperatura interior · sin sensor</small></div><div class="tile"><span class="sym">◌</span><strong>-- %</strong><small>Humedad · sin sensor</small></div></section></div><div class="columns"><section class="lighting"><h2 class="heading">Luces <small>Simulación</small></h2><div class="grid" id="lights"><button type="button" class="tile" aria-pressed="false"><span class="sym">☀</span><strong>Salón</strong><small>Apagada</small></button><button type="button" class="tile" aria-pressed="false"><span class="sym">☀</span><strong>Cocina</strong><small>Apagada</small></button><button type="button" class="tile" aria-pressed="false"><span class="sym">☀</span><strong>Dormitorio</strong><small>Apagada</small></button><button type="button" class="tile" aria-pressed="false"><span class="sym">☀</span><strong>Pasillo</strong><small>Apagada</small></button></div><h2 class="heading">Escenas</h2>
<div class="scenes">
  <button id="allon">Encender todas</button><button id="alloff">Apagar todas</button>
</div></section>
<section class="music">
<h2 class="heading">Música <small>Simulación</small></h2>
<div class="player">
  <div class="album" id="album" aria-hidden="true">♫</div>
  <div class="track" id="track"></div><div class="artist" id="artist"></div>
  <div class="controls">
    <button id="prev" aria-label="Pista anterior">◀◀</button>
    <button id="play" aria-label="Reproducir" aria-pressed="false">▶</button>
    <button id="next" aria-label="Pista siguiente">▶▶</button>
  </div>
  <label class="device" for="echo">Altavoz de ejemplo</label>
  <select id="echo"><option>Echo del salón</option><option>En todas partes</option></select>
  <label class="device" for="volume">Volumen <output id="volumeValue" for="volume">40 %</output></label>
  <input id="volume" type="range" min="0" max="100" value="40">
  <div class="refresh"><button id="refresh">Actualizar estado</button></div>
  <div id="demo" role="status" aria-live="polite"></div>
</div></section></div>
</main>
<footer class="foot">Luces y música simuladas. Smart Life, Spotify, Alexa y Amazon Music están pendientes de conexión.</footer>
<script>
(function(){function pad(n){return n<10?'0'+n:n}function tick(){var d=new Date();var hour=d.getHours();var theme=hour<7||hour>=20?'night':'';if(document.body.className!==theme){document.body.className=theme;}var ds=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],ms=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];document.getElementById('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('date').innerHTML=ds[d.getDay()]+', '+d.getDate()+' de '+ms[d.getMonth()];document.getElementById('greeting').innerHTML=d.getHours()<12?'Buenos días':d.getHours()<20?'Buenas tardes':'Buenas noches'}var tiles=document.getElementById('lights').getElementsByTagName('button');function set(el,on){el.setAttribute('aria-pressed',String(on));el.className=on?'tile on':'tile';el.getElementsByTagName('small')[0].innerHTML=on?'Encendida':'Apagada'}for(var i=0;i<tiles.length;i++)tiles[i].onclick=function(){set(this,this.className.indexOf(' on')===-1)};document.getElementById('alloff').onclick=function(){for(var i=0;i<tiles.length;i++)set(tiles[i],false)};document.getElementById('allon').onclick=function(){for(var i=0;i<tiles.length;i++)set(tiles[i],true)};var tracks = [
  { title: 'Luz de la mañana', artist: 'Pistas de ejemplo', color: '#c8ded8' },
  { title: 'Tarde tranquila', artist: 'Pistas de ejemplo', color: '#f2dcb7' },
  { title: 'La hora azul', artist: 'Pistas de ejemplo', color: '#d8dbef' }
];
var playing = false;
var trackIndex = 0;
var echo = document.getElementById('echo');
var volume = document.getElementById('volume');
var play = document.getElementById('play');
function renderPlayer() {
  var track = tracks[trackIndex];
  document.getElementById('track').textContent = track.title;
  document.getElementById('artist').textContent = track.artist;
  document.getElementById('album').style.backgroundColor = track.color;
  document.getElementById('volumeValue').textContent = volume.value + ' %';
  play.textContent = playing ? 'Ⅱ' : '▶';
  play.setAttribute('aria-pressed', String(playing));
  play.setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
}
function announce(prefix) {
  document.getElementById('demo').textContent = prefix +
    (playing ? 'Reproducción simulada' : 'En pausa') + ' · ' +
    echo.options[echo.selectedIndex].text + ' · ' + volume.value + ' %';
}
play.onclick = function () {
  playing = !playing;
  renderPlayer();
  announce('');
};
function changeTrack(step) {
  trackIndex = (trackIndex + step + tracks.length) % tracks.length;
  renderPlayer();
  announce(tracks[trackIndex].title + ' · ');
}
document.getElementById('prev').onclick = function () { changeTrack(-1); };
document.getElementById('next').onclick = function () { changeTrack(1); };
document.getElementById('refresh').onclick = function () {
  renderPlayer();
  announce('Estado simulado actualizado. ');
};
echo.onchange = function () { announce(''); };
volume.oninput = renderPlayer;
volume.onchange = function () { renderPlayer(); announce(''); };
renderPlayer();
announce('');
tick();
window.addEventListener('pageshow', tick);
document.addEventListener('visibilitychange', tick);
setInterval(tick, 1000);
})();
</script></body></html>
